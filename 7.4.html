<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>D80 Systems — WIP + Ops Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080a0c;
    --surface: #0e1114;
    --surface2: #141820;
    --border: #1e2530;
    --border2: #252d3a;
    --orange: #e07b2a;
    --orange-dim: #7a3f10;
    --green: #2ecc71;
    --green-dim: #1a5c38;
    --red: #e74c3c;
    --red-dim: #6b1f1a;
    --yellow: #f1c40f;
    --yellow-dim: #6b560a;
    --blue: #3498db;
    --text: #d4dbe8;
    --text-dim: #6b7a8d;
    --text-muted: #3a4455;
    --mono: 'Share Tech Mono', monospace;
    --display: 'Barlow Condensed', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); min-height: 100vh; overflow-x: hidden; }

  body::before {
    content: '';
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none; z-index: 9999;
  }

  .header {
    background: var(--surface);
    border-bottom: 2px solid var(--orange);
    padding: 12px 16px;
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-left { display: flex; flex-direction: column; gap: 1px; }
  .header-company { font-family: var(--display); font-size: 11px; font-weight: 700; color: var(--orange); letter-spacing: 3px; text-transform: uppercase; }
  .header-title { font-family: var(--display); font-size: 22px; font-weight: 900; color: var(--text); letter-spacing: 1px; line-height: 1; }
  .header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .breadcrumb {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-dim); overflow-x: auto; white-space: nowrap;
    scrollbar-width: none;
  }
  .breadcrumb::-webkit-scrollbar { display: none; }
  .crumb { cursor: pointer; color: var(--orange); transition: opacity 0.15s; }
  .crumb:hover { opacity: 0.7; }
  .crumb-sep { color: var(--text-muted); }
  .crumb-current { color: var(--text-dim); }

  .main { padding: 16px; max-width: 800px; margin: 0 auto; }

  .section-label {
    font-size: 10px; letter-spacing: 3px; color: var(--text-muted);
    text-transform: uppercase; margin-bottom: 12px; padding-left: 2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    overflow: hidden;
  }
  .card:hover { border-color: var(--orange); background: var(--surface2); }
  .card:active { opacity: 0.85; }
  .card-inner { padding: 14px 16px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .card-name { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
  .card-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .card-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 3px; letter-spacing: 1px; white-space: nowrap; }
  .badge-complete { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
  .badge-active { background: rgba(224,123,42,0.15); color: var(--orange); border: 1px solid var(--orange-dim); }
  .badge-pending { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }

  .progress-row { display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 6px; background: var(--border2); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .progress-pct { font-size: 12px; font-weight: 700; min-width: 38px; text-align: right; }

  .phase-dots { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  .phase-dot {
    font-size: 10px; padding: 2px 7px; border-radius: 2px;
    background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border);
    letter-spacing: 0.5px;
  }
  .phase-dot.done { background: var(--green-dim); color: var(--green); border-color: var(--green-dim); }
  .phase-dot.partial { background: rgba(224,123,42,0.12); color: var(--orange); border-color: var(--orange-dim); }

  .btn-add {
    width: 100%; padding: 12px; background: transparent;
    border: 1px dashed var(--border2); border-radius: 6px;
    color: var(--text-muted); font-family: var(--mono); font-size: 13px;
    cursor: pointer; transition: all 0.15s; letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .btn-add:hover { border-color: var(--orange); color: var(--orange); background: rgba(224,123,42,0.05); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; align-items: flex-end; z-index: 200;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px 12px 0 0;
    padding: 20px 16px 32px;
    width: 100%; max-width: 800px; margin: 0 auto;
    max-height: 90vh; overflow-y: auto;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-title { font-family: var(--display); font-size: 20px; font-weight: 900; color: var(--text); margin-bottom: 16px; }
  .modal-label { font-size: 11px; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 6px; display: block; }
  .modal-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 4px;
    color: var(--text); font-family: var(--mono); font-size: 14px;
    padding: 10px 12px; margin-bottom: 14px; outline: none;
    transition: border-color 0.15s;
  }
  .modal-input:focus { border-color: var(--orange); }
  .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-primary {
    width: 100%; padding: 12px; background: var(--orange);
    border: none; border-radius: 5px; color: #fff;
    font-family: var(--display); font-size: 16px; font-weight: 700;
    cursor: pointer; letter-spacing: 1px; transition: opacity 0.15s;
    margin-top: 4px;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-cancel {
    width: 100%; padding: 11px; background: transparent;
    border: 1px solid var(--border2); border-radius: 5px; color: var(--text-dim);
    font-family: var(--mono); font-size: 13px; cursor: pointer;
    margin-top: 8px; letter-spacing: 1px;
  }

  .device-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .device-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; cursor: pointer;
  }
  .device-header:hover { background: var(--surface2); }
  .device-num { font-size: 11px; color: var(--text-muted); min-width: 28px; }
  .device-type { font-family: var(--display); font-size: 15px; font-weight: 700; flex: 1; color: var(--text); }
  .device-location { font-size: 11px; color: var(--text-dim); flex: 1; }

  .stages { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 12px 10px; }
  .stage-pill {
    font-size: 10px; padding: 4px 9px; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--border2); background: var(--surface2); color: var(--text-muted);
    transition: all 0.12s; letter-spacing: 0.5px; user-select: none;
  }
  .stage-pill.done { background: var(--green-dim); color: var(--green); border-color: var(--green); }
  .stage-pill.s0.done { background: rgba(52,152,219,0.15); color: var(--blue); border-color: var(--blue); }
  .stage-pill.s1.done { background: rgba(224,123,42,0.15); color: var(--orange); border-color: var(--orange); }
  .stage-pill.s2.done { background: rgba(241,196,15,0.15); color: var(--yellow); border-color: var(--yellow); }
  .stage-pill.s3.done { background: rgba(155,89,182,0.2); color: #a569bd; border-color: #7d3c98; }
  .stage-pill.s4.done { background: var(--green-dim); color: var(--green); border-color: var(--green); }

  .device-notes { padding: 0 12px 10px; }
  .note-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text-dim); font-family: var(--mono);
    font-size: 12px; padding: 8px 10px; resize: vertical; outline: none;
    transition: border-color 0.15s; min-height: 52px;
  }
  .note-input:focus { border-color: var(--orange); }
  .note-label { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; margin-bottom: 4px; }

  .btn-delete {
    background: transparent; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 3px;
    transition: color 0.15s;
  }
  .btn-delete:hover { color: var(--red); }

  .stats-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .stat-box {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; padding: 10px; text-align: center;
  }
  .stat-val { font-family: var(--display); font-size: 24px; font-weight: 900; }
  .stat-lbl { font-size: 9px; color: var(--text-muted); letter-spacing: 2px; margin-top: 2px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; line-height: 1.8; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    display: flex; align-items: center; justify-content: center; z-index: 300;
  }
  .confirm-box {
    background: var(--surface); border: 1px solid var(--red);
    border-radius: 8px; padding: 24px 20px; width: 300px; text-align: center;
  }
  .confirm-title { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--red); margin-bottom: 8px; }
  .confirm-msg { font-size: 12px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.6; }
  .confirm-btns { display: flex; gap: 10px; }
  .btn-confirm-yes { flex: 1; padding: 10px; background: var(--red); border: none; border-radius: 4px; color: #fff; font-family: var(--display); font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-confirm-no { flex: 1; padding: 10px; background: transparent; border: 1px solid var(--border2); border-radius: 4px; color: var(--text-dim); font-family: var(--mono); font-size: 12px; cursor: pointer; }

  .icon-btn {
    background: transparent; border: 1px solid var(--border2); border-radius: 4px;
    color: var(--text-dim); cursor: pointer; padding: 6px 10px; font-size: 14px;
    transition: all 0.15s;
  }
  .icon-btn:hover { border-color: var(--orange); color: var(--orange); }

  .app-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .app-tab {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 6px;
    color: var(--text-dim);
    font-family: var(--display);
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1.5px;
    padding: 11px 12px;
    cursor: pointer;
    text-align: center;
  }
  .app-tab.active {
    color: var(--orange);
    border-color: var(--orange);
    background: rgba(224,123,42,.08);
  }
  .ops-clean-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .ops-clean-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 14px;
  }
  .ops-clean-title {
    font-family: var(--display);
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .ops-clean-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .ops-kpi-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .ops-kpi {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 10px 8px;
    text-align: center;
  }
  .ops-kpi-num {
    font-family: var(--display);
    font-size: 26px;
    font-weight: 900;
    line-height: 1;
  }
  .ops-kpi-label {
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    margin-top: 4px;
  }
  .ops-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .ops-tab {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 4px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .7px;
    padding: 8px 4px;
    cursor: pointer;
    text-align: center;
  }
  .ops-tab.active {
    color: var(--orange);
    border-color: var(--orange);
    background: rgba(224,123,42,.08);
  }
  .ops-action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .ops-action {
    background: transparent;
    border: 1px dashed var(--border2);
    border-radius: 5px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 10px;
    cursor: pointer;
    letter-spacing: .5px;
  }
  .ops-action:hover {
    color: var(--orange);
    border-color: var(--orange);
    background: rgba(224,123,42,.05);
  }
  .ops-list { margin-bottom: 14px; }
  .ops-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 11px 12px;
    margin-bottom: 8px;
  }
  .ops-item-top {
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
    margin-bottom:6px;
  }
  .ops-item-title {
    font-family: var(--display);
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    letter-spacing:.4px;
  }
  .ops-item-meta {
    font-size:10px;
    color: var(--text-dim);
    line-height:1.5;
  }
  .ops-item-note {
    font-size:11px;
    color: var(--text-dim);
    line-height:1.5;
    margin-top:6px;
  }
  .ops-pill {
    display:inline-block;
    font-size:9px;
    padding:2px 6px;
    border-radius:3px;
    border:1px solid var(--border2);
    color: var(--text-dim);
    background: var(--surface2);
    margin-left:4px;
    letter-spacing:.6px;
  }
  .ops-pill.red { color:var(--red); border-color:var(--red-dim); background:rgba(231,76,60,.08); }
  .ops-pill.yellow { color:var(--yellow); border-color:var(--yellow-dim); background:rgba(241,196,15,.08); }
  .ops-pill.green { color:var(--green); border-color:var(--green-dim); background:rgba(46,204,113,.08); }
  .ops-mini-btn {
    border:1px solid var(--border2);
    background:transparent;
    color:var(--text-dim);
    border-radius:3px;
    padding:4px 7px;
    font-size:10px;
    font-family:var(--mono);
    cursor:pointer;
    white-space:nowrap;
  }
  .ops-mini-btn:hover { color:var(--orange); border-color:var(--orange); }
  .brief-box {
    background: #f4f6f9;
    color: #1a1e24;
    font-family: Arial, sans-serif;
    white-space: pre-wrap;
    padding: 16px;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  @media (max-width: 560px) {
    .header { align-items:flex-start; }
    .header-right { justify-content:flex-end; max-width: 72%; }
    .header-right .icon-btn { font-size: 12px; padding: 6px 8px; }
    .ops-kpi-row { grid-template-columns: repeat(3, 1fr); }
    .ops-tabs { grid-template-columns: repeat(2, 1fr); }
  }



  .ops-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 16px 0; }
  .ops-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
  .ops-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .ops-title { font-family: var(--display); font-size: 16px; font-weight: 800; letter-spacing: 1px; color: var(--text); }
  .ops-mini { font-size: 10px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; }
  .ops-list { display:flex; flex-direction:column; gap:6px; }
  .ops-item { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; font-size: 12px; color: var(--text-dim); }
  .ops-item strong { color: var(--text); }
  .ops-item .tag { display:inline-block; font-size:10px; padding:2px 6px; border-radius:3px; margin-right:5px; border:1px solid var(--border2); color:var(--text-dim); }
  .tag-open { color: var(--red); border-color: var(--red-dim); background: rgba(231,76,60,0.08); }
  .tag-ready { color: var(--green); border-color: var(--green-dim); background: rgba(46,204,113,0.08); }
  .tag-warn { color: var(--orange); border-color: var(--orange-dim); background: rgba(224,123,42,0.08); }
  .mini-btn { background: transparent; border: 1px solid var(--border2); border-radius: 4px; color: var(--orange); font-family: var(--mono); font-size: 11px; cursor: pointer; padding: 5px 8px; letter-spacing: 1px; }
  .mini-btn:hover { border-color: var(--orange); }
  .modal-input.textarea { min-height: 76px; resize: vertical; }


.bulk-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 14px;
  margin-bottom: 12px;
}
.bulk-title {
  font-family: var(--display);
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--text);
  margin-bottom: 4px;
}
.bulk-sub {
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.5;
  margin-bottom: 12px;
}
.bulk-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.bulk-field label {
  display: block;
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1.6px;
  margin-bottom: 5px;
  text-transform: uppercase;
}
.bulk-field input, .bulk-field select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  padding: 10px;
  outline: none;
}
.bulk-field input:focus, .bulk-field select:focus { border-color: var(--orange); }
.bulk-full { grid-column: 1 / -1; }
.bulk-btn {
  width: 100%;
  padding: 12px;
  background: var(--orange);
  border: none;
  border-radius: 5px;
  color: #fff;
  font-family: var(--display);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: 1px;
  margin-top: 12px;
}
.supabase-box {
  background: rgba(52,152,219,.06);
  border: 1px solid rgba(52,152,219,.35);
  border-radius: 7px;
  padding: 14px;
  margin-bottom: 12px;
}
.supabase-status {
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.6;
}
@media (max-width: 560px) {
  .bulk-grid { grid-template-columns: 1fr; }
}


.auth-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 14px;
  margin-bottom: 12px;
}
.auth-title {
  font-family: var(--display);
  font-size: 20px;
  font-weight: 900;
  color: var(--text);
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.auth-sub {
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.5;
  margin-bottom: 12px;
}
.auth-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.auth-grid input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  padding: 10px;
  outline: none;
}
.auth-grid input:focus { border-color: var(--orange); }
.auth-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}
.auth-btn {
  padding: 11px;
  background: var(--orange);
  border: none;

function isUuid(value) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ''));
}

function generateUuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function loadCloudIdMap() {
  try {
    return JSON.parse(localStorage.getItem('d80_cloud_id_map') || '{}');
  } catch {
    return {};
  }
}

function saveCloudIdMap(map) {
  localStorage.setItem('d80_cloud_id_map', JSON.stringify(map || {}));
}

function getCloudId(localId) {
  if (!localId) return null;
  if (isUuid(localId)) return localId;

  const map = loadCloudIdMap();
  if (!map[localId]) {
    map[localId] = generateUuid();
    saveCloudIdMap(map);
  }
  return map[localId];
}

function toUuidMap() {
  return {
    get(oldId) {
      return getCloudId(oldId);
    }
  };
}


function scheduleCloudAutoSave(reason) {
  if (cloudSyncPaused) return;
  if (!authUser) return;
  if (!SUPABASE_CONFIG.enabled) return;

  cloudLastError = null;
  cloudSavePending = true;

  if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(() => {
    cloudSaveTimer = null;
    autoSaveToSupabase(reason || 'data change');
  }, 1200);
}

async function autoSaveToSupabase(reason) {
  if (!authUser || cloudSyncPaused) return;

  if (cloudSaveInProgress) {
    cloudSavePending = true;
    return;
  }

  cloudSaveInProgress = true;
  cloudSavePending = false;

  try {
    await pushLocalToSupabase({ silent: true, reason: reason || 'autosave' });
    cloudLastSavedAt = new Date();
    cloudLastError = null;
  } catch (err) {
    console.error('Autosave failed:', err);
    cloudLastError = err.message || String(err);
  } finally {
    cloudSaveInProgress = false;
    render();

    if (cloudSavePending) {
      cloudSavePending = false;
      scheduleCloudAutoSave('pending changes');
    }
  }
}

function cloudStatusText() {
  if (!authUser) return 'Sign in required';
  if (cloudSaveInProgress) return 'Saving changes...';
  if (cloudSavePending) return 'Save queued';
  if (cloudLastError) return 'Last save failed: ' + cloudLastError;
  if (cloudLastSavedAt) return 'Last saved ' + cloudLastSavedAt.toLocaleTimeString();
  return 'Ready';
}


async function pushLocalToSupabase(options = {}) {
  const silent = !!options.silent;
  const client = getSupabaseClient();
  if (!client) {
    if (silent) throw new Error('Supabase client is not available.');
    return alert('Supabase client is not available.');
  }
  if (!authUser) {
    if (silent) throw new Error('Log in first.');
    return alert('Log in first.');
  }

  const db = DB.get();
  if (!db.projects.length) {
    if (silent) return;
    return alert('No local project data to sync.');
  }

  const idMap = toUuidMap();

  try {
    await ensureProfile();

    const projectRows = db.projects.map(p => ({
      id: idMap.get(p.id),
      owner_id: authUser.id,
      name: p.name || 'Untitled Project',
      type: p.type || '',
      notes: p.notes || '',
      created_at: new Date(p.createdAt || Date.now()).toISOString()
    }));

    const buildingRows = db.buildings.map(b => ({
      id: idMap.get(b.id),
      project_id: idMap.get(b.projectId),
      name: b.name || 'Building',
      notes: b.notes || '',
      created_at: new Date(b.createdAt || Date.now()).toISOString()
    }));

    const floorRows = db.floors.map(f => ({
      id: idMap.get(f.id),
      building_id: idMap.get(f.buildingId),
      name: f.name || 'Floor',
      created_at: new Date(f.createdAt || Date.now()).toISOString()
    }));

    const areaRows = db.areas.map(a => ({
      id: idMap.get(a.id),
      floor_id: idMap.get(a.floorId),
      name: a.name || 'Area',
      created_at: new Date(a.createdAt || Date.now()).toISOString()
    }));

    const deviceRows = db.devices.map(d => ({
      id: idMap.get(d.id),
      area_id: idMap.get(d.areaId),
      type: d.type || 'Device',
      location: d.location || '',
      stages: d.stages || [false,false,false,false,false],
      notes: d.notes || '',
      created_at: new Date(d.createdAt || Date.now()).toISOString()
    }));

    const projectIdForOps = projectRows[0]?.id || null;

    const inspectionRows = (db.inspections || []).map(x => ({
      id: idMap.get(x.id),
      project_id: projectIdForOps,
      scope_type: x.scopeType || 'project',
      scope_id: idMap.get(x.scopeId) || projectIdForOps,
      type: x.type || '',
      date: x.date || null,
      status: x.status || 'Scheduled',
      inspector: x.inspector || '',
      notes: x.notes || '',
      created_at: new Date(x.createdAt || Date.now()).toISOString()
    })).filter(x => x.project_id);

    const deficiencyRows = (db.deficiencies || []).map(x => ({
      id: idMap.get(x.id),
      project_id: projectIdForOps,
      scope_type: x.scopeType || 'project',
      scope_id: idMap.get(x.scopeId) || projectIdForOps,
      title: x.title || 'Punch Item',
      priority: x.priority || 'Normal',
      status: x.status || 'Open',
      owner: x.owner || '',
      notes: x.notes || '',
      created_at: new Date(x.createdAt || Date.now()).toISOString()
    })).filter(x => x.project_id);

    const crewRows = (db.crewLogs || []).map(x => ({
      id: idMap.get(x.id),
      project_id: projectIdForOps,
      scope_type: x.scopeType || 'project',
      scope_id: idMap.get(x.scopeId) || projectIdForOps,
      date: x.date || new Date().toISOString().split('T')[0],
      crew_count: parseInt(x.crewCount || 0, 10) || 0,
      owner: x.owner || '',
      notes: x.notes || '',
      created_at: new Date(x.createdAt || Date.now()).toISOString()
    })).filter(x => x.project_id);

    const steps = [
      ['projects', projectRows],
      ['buildings', buildingRows],
      ['floors', floorRows],
      ['areas', areaRows],
      ['devices', deviceRows],
      ['inspections', inspectionRows],
      ['deficiencies', deficiencyRows],
      ['crew_logs', crewRows]
    ];

    for (const [table, rows] of steps) {
      if (!rows.length) continue;
      const { error } = await client.from(table).upsert(rows);
      if (error) throw new Error(`${table}: ${error.message}`);
    }

    if (!silent) alert('Cloud sync complete.');
  } catch (err) {
    console.error(err);
    if (silent) throw err;
    alert('Cloud sync failed: ' + err.message);
  }
}

async function pullSupabaseToLocal() {
  const client = getSupabaseClient();
  if (!client) return alert('Supabase client is not available.');

      alert('No cloud projects found for this account.');
      return;

    const buildingsRes = await client.from('buildings').select('*').in('project_id', projectIds).order('created_at', { ascending: true });
    if (buildingsRes.error) throw new Error(buildingsRes.error.message);
    const buildingIds = (buildingsRes.data || []).map(b => b.id);

    const floorsRes = buildingIds.length
      ? await client.from('floors').select('*').in('building_id', buildingIds).order('created_at', { ascending: true })
      : { data: [], error: null };
    if (floorsRes.error) throw new Error(floorsRes.error.message);

    const deficienciesRes = await client.from('deficiencies').select('*').in('project_id', projectIds).order('created_at', { ascending: true });

        createdAt: b.created_at ? new Date(b.created_at).getTime() : Date.now()
      })),
      floors: (floorsRes.data || []).map(f => ({
        id: f.id,
        buildingId: f.building_id,
        name: f.name,
        createdAt: f.created_at ? new Date(f.created_at).getTime() : Date.now()
      })),
      areas: (areasRes.data || []).map(a => ({
        id: a.id,
        floorId: a.floor_id,
        name: a.name,
        createdAt: a.created_at ? new Date(a.created_at).getTime() : Date.now()
      })),
      devices: (devicesRes.data || []).map(d => ({
        id: d.id,
        areaId: d.area_id,
        type: d.type,
        location: d.location || '',
        stages: Array.isArray(d.stages) ? d.stages : [false,false,false,false,false],
        notes: d.notes || '',
        createdAt: d.created_at ? new Date(d.created_at).getTime() : Date.now()
      })),
      inspections: (inspectionsRes.data || []).map(x => ({
        id: x.id,
        scopeType: x.scope_type,
        scopeId: x.scope_id,
        type: x.type || '',
        date: x.date || '',
        status: x.status || 'Scheduled',
        inspector: x.inspector || '',

        title: x.title || '',
        priority: x.priority || 'Normal',
        status: x.status || 'Open',

        createdAt: x.created_at ? new Date(x.created_at).getTime() : Date.now()
      })),

// ============================================================
// SORT HELPERS — keep field lists in human order
// ============================================================
function naturalCompare(a, b) {
  return String(a || '').localeCompare(String(b || ''), undefined, { numeric: true, sensitivity: 'base' });
}

function numberFromName(name) {
  const match = String(name || '').match(/\d+/);
  return match ? parseInt(match[0], 10) : 999999;
}

function areaSortRank(area) {
  const name = String(area?.name || '').toLowerCase().trim();
  if (name.startsWith('unit')) return 10;
  if (name.startsWith('corridor')) return 20;
  if (name.startsWith('stairwell') || name.startsWith('stair')) return 30;
  if (name.includes('elevator')) return 40;
  if (name.includes('electrical') || name.includes('elec')) return 50;
  if (name.includes('mechanical') || name.includes('mech')) return 60;
  if (name.includes('mdf') || name.includes('idf')) return 70;
  if (name.includes('clubhouse')) return 80;
  return 90;
}

function sortByName(list) {
  return [...(list || [])].sort((a, b) => naturalCompare(a.name, b.name));
}

function sortBuildings(list) {
  return [...(list || [])].sort((a, b) => naturalCompare(a.name, b.name));
}

function sortFloors(list) {
  return [...(list || [])].sort((a, b) => {
    const an = numberFromName(a.name);
    const bn = numberFromName(b.name);
    if (an !== bn) return an - bn;
    return naturalCompare(a.name, b.name);
  });
}

function sortAreas(list) {
  return [...(list || [])].sort((a, b) => {
    const ar = areaSortRank(a);
    const br = areaSortRank(b);
    if (ar !== br) return ar - br;
    const an = numberFromName(a.name);
    const bn = numberFromName(b.name);
    if (an !== bn) return an - bn;
    return naturalCompare(a.name, b.name);
  });
}

function sortDevices(list) {
  return [...(list || [])].sort((a, b) => {
    const loc = naturalCompare(a.location, b.location);
    if (loc !== 0) return loc;
    return naturalCompare(a.type, b.type);
  });
}


const STAGES = ['Boxed','Wired','Res. Test','Device','Tested'];

function deviceProgress(device) {
  const stages = device.stages || [false,false,false,false,false];
  const done = stages.filter(Boolean).length;
  return { done, total: 5, pct: Math.round((done/5)*100) };
}

function areaProgress(areaId) {
  const db = DB.get();
  const devices = db.devices.filter(d => d.areaId === areaId);
  if (!devices.length) return { done: 0, total: 0, pct: 0, deviceCount: 0 };
  const totalStages = devices.length * 5;
  const doneStages = devices.reduce((acc, d) => acc + (d.stages||[]).filter(Boolean).length, 0);
  return { done: doneStages, total: totalStages, pct: Math.round((doneStages/totalStages)*100), deviceCount: devices.length };
}

function floorProgress(floorId) {
  const db = DB.get();
  const areas = db.areas.filter(a => a.floorId === floorId);
  if (!areas.length) return { pct: 0, deviceCount: 0 };
  let totalStages = 0, doneStages = 0, deviceCount = 0;
  areas.forEach(a => {
    const p = areaProgress(a.id);
    totalStages += p.total; doneStages += p.done; deviceCount += p.deviceCount;
  });
  return { pct: totalStages ? Math.round((doneStages/totalStages)*100) : 0, deviceCount };
}

function buildingProgress(buildingId) {
  const db = DB.get();
  const floors = db.floors.filter(f => f.buildingId === buildingId);
  if (!floors.length) return { pct: 0, deviceCount: 0 };
  let totalStages = 0, doneStages = 0, deviceCount = 0;
  floors.forEach(f => {
    const areas = sortAreas(db.areas.filter(a => a.floorId === f.id));
    areas.forEach(a => {
      const p = areaProgress(a.id);
      totalStages += p.total; doneStages += p.done; deviceCount += p.deviceCount;
    });
  });
  return { pct: totalStages ? Math.round((doneStages/totalStages)*100) : 0, deviceCount };
}

function projectProgress(projectId) {
  const db = DB.get();
  const buildings = sortBuildings(db.buildings.filter(b => b.projectId === projectId));
  if (!buildings.length) return { pct: 0, deviceCount: 0, buildingCount: buildings.length };
  let totalStages = 0, doneStages = 0, deviceCount = 0;
  buildings.forEach(b => {
    const floors = db.floors.filter(f => f.buildingId === b.id);
    floors.forEach(f => {
      const areas = sortAreas(db.areas.filter(a => a.floorId === f.id));
      areas.forEach(a => {
        const p = areaProgress(a.id);
        totalStages += p.total; doneStages += p.done; deviceCount += p.deviceCount;
      });
    });
  });
  return { pct: totalStages ? Math.round((doneStages/totalStages)*100) : 0, deviceCount, buildingCount: buildings.length };
}

  if (diff < 0) return 'tag-open';
  if (diff <= 3) return 'tag-warn';
  return 'tag-ready';
}

function getOrCreateArea(db, floorId, name) {
  let area = db.areas.find(a => a.floorId === floorId && String(a.name).toLowerCase() === String(name).toLowerCase());
  if (!area) {
    area = { id: uid(), floorId, name, createdAt: Date.now() };
    db.areas.push(area);
  }
  return area;
}

function bulkAddUnitDevices() {
  const db = DB.get();
  const floorId = document.getElementById('bulk-floor')?.value || '';
  const startUnit = parseInt(document.getElementById('bulk-start-unit')?.value || '0', 10);
  const endUnit = parseInt(document.getElementById('bulk-end-unit')?.value || '0', 10);
  const oddQty = parseInt(document.getElementById('bulk-odd-qty')?.value || '0', 10);
  const evenQty = parseInt(document.getElementById('bulk-even-qty')?.value || '0', 10);
  const deviceType = document.getElementById('bulk-device-type')?.value.trim() || 'Horn/Strobe';

  if (!floorId || !startUnit || !endUnit || endUnit < startUnit) {
    alert('Check target floor and unit range.');
    return;
  }

  let added = 0;
  for (let unit = startUnit; unit <= endUnit; unit++) {
    const area = getOrCreateArea(db, floorId, `Unit ${unit}`);
    const qty = unit % 2 === 0 ? evenQty : oddQty;
    for (let i = 0; i < qty; i++) {
      db.devices.push({
        id: uid(),
        areaId: area.id,
        type: deviceType,
        location: `Unit ${unit} - #${i + 1}`,
        stages: [false,false,false,false,false],
        notes: '',
        createdAt: Date.now()
      });
      added++;
    }
  }

  DB.set(db);
  alert(`Added ${added} devices.`);
  render();
}

function bulkAddStairwells() {
  const db = DB.get();
  const floorId = document.getElementById('stair-floor')?.value || '';
  const count = parseInt(document.getElementById('stair-count')?.value || '0', 10);
  const addPulls = document.getElementById('stair-pulls')?.value === 'yes';
  const deviceType = document.getElementById('stair-device-type')?.value.trim() || 'Horn/Strobe';
  const floor = db.floors.find(f => f.id === floorId);

  if (!floorId || !count) {
    alert('Check target floor and stairwell count.');
    return;
  }

  let added = 0;
  for (let s = 1; s <= count; s++) {
    const area = getOrCreateArea(db, floorId, `Stairwell ${s}`);
    db.devices.push({
      id: uid(),
      areaId: area.id,
      type: deviceType,
      location: `Stairwell ${s} - ${floor?.name || 'Floor'}`,
      stages: [false,false,false,false,false],
      notes: '',
      createdAt: Date.now()
    });
    added++;

    if (addPulls) {
      db.devices.push({
        id: uid(),
        areaId: area.id,
        type: 'Pull Station',
        location: `Stairwell ${s} - ${floor?.name || 'Floor'} entry`,
        stages: [false,false,false,false,false],
        notes: '',
        createdAt: Date.now()
      });
      added++;
    }
  }

  DB.set(db);
  alert(`Added ${added} stairwell devices.`);
  render();
}

function cloneBuildingFromBulk() {
  const sourceId = document.getElementById('clone-source')?.value || '';
  const newName = document.getElementById('clone-name')?.value.trim() || '';
  if (!sourceId || !newName) {
    alert('Pick a source building and enter a new building name.');
    return;
  }

  const db = DB.get();
  const source = db.buildings.find(b => b.id === sourceId);
  if (!source) return;

  const newBid = uid();
  db.buildings.push({ id: newBid, projectId: source.projectId, name: newName, notes: source.notes || '', createdAt: Date.now() });

  sortFloors(db.floors.filter(f => f.buildingId === sourceId)).forEach(f => {
    const newFid = uid();
    db.floors.push({ id: newFid, buildingId: newBid, name: f.name, createdAt: Date.now() });

    sortAreas(db.areas.filter(a => a.floorId === f.id)).forEach(a => {
      const newAid = uid();
      db.areas.push({ id: newAid, floorId: newFid, name: a.name, createdAt: Date.now() });

      sortDevices(db.devices.filter(d => d.areaId === a.id)).forEach(d => {
        db.devices.push({
          id: uid(),
          areaId: newAid,
          type: d.type,
          location: d.location,
          stages: [false,false,false,false,false],
          notes: '',
          createdAt: Date.now()
        });
      });
    });
  });

  DB.set(db);
  state.appSection = 'wip';
  state.projectId = source.projectId;
  state.buildingId = newBid;
  state.view = 'floors';
  render();
}

function navTo(level) {
  const views = ['projects','buildings','floors','areas','devices'];
  const clears = [
    ['projectId','buildingId','floorId','areaId'],
    ['buildingId','floorId','areaId'],
    ['floorId','areaId'],
    ['areaId'],
    []
  ];
  state.view = views[level];
  clears[level].forEach(k => state[k] = null);
  render();
}

function buildBreadcrumb() {
  const db = DB.get();
  const crumbs = [{ label: 'PROJECTS', level: 0 }];
  if (state.projectId) {
    const p = db.projects.find(x => x.id === state.projectId);
    crumbs.push({ label: p?.name || '-', level: 1 });
  }
  if (state.buildingId) {
    const b = db.buildings.find(x => x.id === state.buildingId);
    crumbs.push({ label: b?.name || '-', level: 2 });
  }
  if (state.floorId) {
    const f = db.floors.find(x => x.id === state.floorId);
    crumbs.push({ label: f?.name || '-', level: 3 });
  }
  if (state.areaId) {
    const a = db.areas.find(x => x.id === state.areaId);
    crumbs.push({ label: a?.name || '-', level: 4 });
  }

  const backLevel = crumbs.length >= 2 ? crumbs[crumbs.length - 2].level : null;
  const backBtn = backLevel !== null
    ? `<button onclick="navTo(${backLevel})" style="background:var(--surface);border:1px solid var(--border2);border-radius:4px;color:var(--orange);font-family:var(--mono);font-size:12px;padding:4px 10px;cursor:pointer;white-space:nowrap;margin-right:8px;">◀ BACK</button>`
    : '';

  const parts = crumbs.map((c, i) => {
    const isLast = i === crumbs.length - 1;
    const sep = i > 0 ? `<span class="crumb-sep"> › </span>` : '';
    if (isLast) return `${sep}<span class="crumb-current">${c.label}</span>`;
    return `${sep}<span class="crumb" onclick="navTo(${c.level})">${c.label}</span>`;
  });

  return `<div class="breadcrumb">${backBtn}${parts.join('')}</div>`;
}

function buildView() {
  switch (state.view) {
    case 'projects': return buildProjectsView();
    case 'buildings': return buildBuildingsView();
    case 'floors': return buildFloorsView();

            <button class="btn-delete" onclick="event.stopPropagation();confirmDelete('area','${a.id}','${escStr(a.name)}')" title="Delete">✕</button>
          </div>
          <div class="progress-row">
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
            <span class="progress-pct" style="color:${color}">${pct}%</span>
          </div>
          ${prog.deviceCount > 0 ? `
          <div class="phase-dots">
            ${STAGES.map((s,si) => {
              const cnt = stageCounts[si];
              const cls = cnt === prog.deviceCount ? 'done' : cnt > 0 ? 'partial' : '';
              return `<span class="phase-dot ${cls}">${s} ${cnt}/${prog.deviceCount}</span>`;
            }).join('')}
          </div>` : ''}
        </div>
      </div>`;
  });
  html += buildOpsPanel('floor', state.floorId);
  html += `<button class="btn-add" onclick="openModal('area','${state.floorId}')">+ ADD AREA</button>`;
  return html;
}

function buildDevicesView() {
  const db = DB.get();
  const area = db.areas.find(a => a.id === state.areaId);
  const devices = sortDevices(db.devices.filter(d => d.areaId === state.areaId));
  const prog = areaProgress(state.areaId);

  let html = `
    <div class="section-label">DEVICES — ${escapeHtml(area?.name || '')}</div>`;
  html += `
    <div class="stats-row">
      <div class="stat-box"><div class="stat-val" style="color:var(--text)">${prog.deviceCount}</div><div class="stat-lbl">DEVICES</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${progressColor(prog.pct)}">${prog.pct}%</div><div class="stat-lbl">COMPLETE</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--green)">${devices.filter(d=>(d.stages||[]).every(Boolean)).length}</div><div class="stat-lbl">DONE</div></div>
    </div>`;

  if (!devices.length) html += `<div class="empty">No devices yet.<br>Add devices to this area.</div>`;

  devices.forEach((dev, i) => {
    const expanded = state.expandedDevices[dev.id];
    const stages = dev.stages || [false,false,false,false,false];
    const devPct = Math.round(stages.filter(Boolean).length / 5 * 100);
    const allDone = stages.every(Boolean);
    html += `
      <div class="device-row" style="${allDone ? 'border-color:var(--green-dim)' : ''}">
        <div class="device-header" onclick="toggleDevice('${dev.id}')">
          <span class="device-num">#${String(i+1).padStart(2,'0')}</span>
          <span class="device-type">${escapeHtml(dev.type)}</span>
          <span class="device-location">${escapeHtml(dev.location||'')}</span>
          <span style="font-size:11px;color:${progressColor(devPct)};min-width:32px;text-align:right">${devPct}%</span>
          <button class="btn-delete" onclick="event.stopPropagation();confirmDelete('device','${dev.id}','${escStr(dev.type)}')" style="margin-left:4px">✕</button>
          <span style="color:var(--text-muted);font-size:12px;margin-left:4px">${expanded?'▲':'▼'}</span>
        </div>
        ${expanded ? `
        <div class="stages">
          ${STAGES.map((s,si) => `
            <span class="stage-pill s${si} ${stages[si]?'done':''}" onclick="toggleStage('${dev.id}',${si})">${s}</span>
          `).join('')}
        </div>
        <div class="device-notes">
          <div class="note-label">NOTES</div>
          <textarea class="note-input" placeholder="Field notes, deficiencies, wire tags..." onchange="saveNote('${dev.id}',this.value)" onblur="saveNote('${dev.id}',this.value)">${escapeHtml(dev.notes||'')}</textarea>
        </div>` : ''}
      </div>`;
  });

  html += buildOpsPanel('area', state.areaId);
  html += `<button class="btn-add" onclick="openModal('device','${state.areaId}')">+ ADD DEVICE</button>`;
  return html;
}

function openModal(type, parentId) { state.modal = { type, parentId }; render(); }
function closeModal(e) { if (e.target.classList.contains('modal-overlay')) { state.modal = null; render(); } }

function saveModal(type, parentId) {
  const db = DB.get();
  const name = document.getElementById('m-name')?.value.trim();
  const mtype = document.getElementById('m-type')?.value.trim();
  const notes = document.getElementById('m-notes')?.value.trim();
  const location = document.getElementById('m-location')?.value.trim();
  const qty = parseInt(document.getElementById('m-qty')?.value || '1', 10) || 1;

  if (type === 'project') {
    if (!name) return;
    db.projects.push({ id: uid(), name, type: mtype||'', notes: notes||'', createdAt: Date.now() });
  } else if (type === 'building') {
    if (!name) return;
    db.buildings.push({ id: uid(), projectId: parentId, name, notes: notes||'', createdAt: Date.now() });
  } else if (type === 'floor') {
    if (!name) return;
    db.floors.push({ id: uid(), buildingId: parentId, name, createdAt: Date.now() });
  } else if (type === 'area') {
    if (!name) return;
    db.areas.push({ id: uid(), floorId: parentId, name, createdAt: Date.now() });
  } else if (type === 'inspection') {
    const [scopeType, scopeId] = String(parentId || '').split('|');
    const date = document.getElementById('m-date')?.value || '';
    const status = document.getElementById('m-status')?.value || 'Scheduled';
    const ahj = document.getElementById('m-ahj')?.value.trim() || '';
    if (!mtype || !scopeType || !scopeId) return;
    db.inspections.push({ id: uid(), scopeType, scopeId, type: mtype, date, status, ahj, notes: notes||'', createdAt: Date.now() });
  } else if (type === 'deficiency') {
    const [scopeType, scopeId] = String(parentId || '').split('|');
    const title = document.getElementById('m-title')?.value.trim();
    const priority = document.getElementById('m-priority')?.value || 'Medium';
    const status = document.getElementById('m-status')?.value || 'Open';
    const owner = document.getElementById('m-owner')?.value.trim() || '';
    const dueDate = document.getElementById('m-due')?.value || '';
    if (!title || !scopeType || !scopeId) return;
    db.deficiencies.push({ id: uid(), scopeType, scopeId, title, priority, status, owner, dueDate, notes: notes||'', createdAt: Date.now() });
  } else if (type === 'device') {
    if (!mtype) return;
    for (let i = 0; i < Math.min(qty, 100); i++) {
      db.devices.push({ id: uid(), areaId: parentId, type: mtype, location: location||'', stages: [false,false,false,false,false], notes: '', createdAt: Date.now() });
    }
  } else if (type === 'inspection') {
    const scope = parseScopeParent(parentId);
    const date = document.getElementById('m-date')?.value || '';
    const status = document.getElementById('m-status')?.value.trim() || 'Scheduled';
    const inspector = document.getElementById('m-inspector')?.value.trim() || '';
    if (!mtype && !date) return;
    db.inspections.push({ id: uid(), scopeType: scope.scopeType, scopeId: scope.scopeId, type: mtype||'', date, status, inspector, notes: notes||'', createdAt: Date.now() });
  } else if (type === 'deficiency') {
    const scope = parseScopeParent(parentId);
    const title = document.getElementById('m-title')?.value.trim() || '';
    const priority = document.getElementById('m-priority')?.value.trim() || 'Normal';
    const status = document.getElementById('m-status')?.value.trim() || 'Open';
    const owner = document.getElementById('m-owner')?.value.trim() || '';
    if (!title) return;
    db.deficiencies.push({ id: uid(), scopeType: scope.scopeType, scopeId: scope.scopeId, title, priority, status, owner, notes: notes||'', createdAt: Date.now() });
  } else if (type === 'material') {
    const scope = parseScopeParent(parentId);
    const item = document.getElementById('m-item')?.value.trim() || '';
    const qtyNeeded = parseInt(document.getElementById('m-qty-needed')?.value || '0', 10) || 0;
    const qtyOnHand = parseInt(document.getElementById('m-qty-hand')?.value || '0', 10) || 0;
    const date = document.getElementById('m-date')?.value || '';
    const status = document.getElementById('m-status')?.value.trim() || 'Needed';
    if (!item) return;
    db.materials.push({ id: uid(), scopeType: scope.scopeType, scopeId: scope.scopeId, item, qtyNeeded, qtyOnHand, date, status, notes: notes||'', createdAt: Date.now() });
  } else if (type === 'crewLog') {
    const scope = parseScopeParent(parentId);
    const date = document.getElementById('m-date')?.value || new Date().toISOString().split('T')[0];
    const crewCount = parseInt(document.getElementById('m-crew-count')?.value || '0', 10) || 0;
    const owner = document.getElementById('m-owner')?.value.trim() || '';
    if (!notes && !crewCount && !owner) return;
    db.crewLogs.push({ id: uid(), scopeType: scope.scopeType, scopeId: scope.scopeId, date, crewCount, owner, notes: notes||'', createdAt: Date.now() });
  }

  DB.set(db);
  state.modal = null;
  render();
}

function toggleDevice(id) {
  state.expandedDevices[id] = !state.expandedDevices[id];
  render();
}

function toggleStage(deviceId, stageIdx) {
  const db = DB.get();
  const dev = db.devices.find(d => d.id === deviceId);
  if (!dev) return;
  if (!dev.stages) dev.stages = [false,false,false,false,false];
  dev.stages[stageIdx] = !dev.stages[stageIdx];
  DB.set(db);
  render();
}

function saveNote(deviceId, value) {
  const db = DB.get();
  const dev = db.devices.find(d => d.id === deviceId);
  if (!dev) return;
  dev.notes = value;
  DB.set(db);
}

function drillProject(id) { state.projectId = id; state.view = 'buildings'; render(); }
function drillBuilding(id) { state.buildingId = id; state.view = 'floors'; render(); }
function drillFloor(id) { state.floorId = id; state.view = 'areas'; render(); }
function drillArea(id) { state.areaId = id; state.view = 'devices'; render(); }

function confirmDelete(type, id, name) {
  state.confirm = {
    msg: `Delete <strong>${name}</strong> and all data inside it? This cannot be undone.`,
    onConfirm: () => deleteItem(type, id)
  };
  render();
}

function runConfirm() {
  if (state.confirm?.onConfirm) state.confirm.onConfirm();
  state.confirm = null;
}


function deleteOpsItem(type, id) {
  const db = DB.get();
  if (type === 'inspection') db.inspections = db.inspections.filter(x => x.id !== id);
  if (type === 'deficiency') db.deficiencies = db.deficiencies.filter(x => x.id !== id);
  DB.set(db);
  render();
}

function removeOpsForScopes(db, scopes) {
  const key = x => `${x.scopeType}|${x.scopeId}`;
  const bad = new Set(scopes.map(s => `${s.type}|${s.id}`));
  db.inspections = db.inspections.filter(x => !bad.has(key(x)));
  db.deficiencies = db.deficiencies.filter(x => !bad.has(key(x)));
}
function deleteItem(type, id) {
  const db = DB.get();
  if (type === 'project') {
    const bids = db.buildings.filter(b => b.projectId === id).map(b => b.id);
    const fids = db.floors.filter(f => bids.includes(f.buildingId)).map(f => f.id);
    const aids = db.areas.filter(a => fids.includes(a.floorId)).map(a => a.id);
    const dids = db.devices.filter(d => aids.includes(d.areaId)).map(d => d.id);
    removeOpsForScopes(db, [{type:'project',id}, ...bids.map(x=>({type:'building',id:x})), ...fids.map(x=>({type:'floor',id:x})), ...aids.map(x=>({type:'area',id:x})), ...dids.map(x=>({type:'device',id:x}))]);
    db.devices = db.devices.filter(d => !aids.includes(d.areaId));
    db.areas = db.areas.filter(a => !fids.includes(a.floorId));
    db.floors = db.floors.filter(f => !bids.includes(f.buildingId));
    db.buildings = db.buildings.filter(b => b.projectId !== id);
    db.projects = db.projects.filter(p => p.id !== id);
    state.view = 'projects'; state.projectId = null; state.buildingId = null; state.floorId = null; state.areaId = null;
  } else if (type === 'building') {
    const fids = db.floors.filter(f => f.buildingId === id).map(f => f.id);
    const aids = db.areas.filter(a => fids.includes(a.floorId)).map(a => a.id);
    const dids = db.devices.filter(d => aids.includes(d.areaId)).map(d => d.id);
    removeOpsForScopes(db, [{type:'building',id}, ...fids.map(x=>({type:'floor',id:x})), ...aids.map(x=>({type:'area',id:x})), ...dids.map(x=>({type:'device',id:x}))]);
    db.devices = db.devices.filter(d => !aids.includes(d.areaId));
    db.areas = db.areas.filter(a => !fids.includes(a.floorId));
    db.floors = db.floors.filter(f => f.buildingId !== id);
    db.buildings = db.buildings.filter(b => b.id !== id);
    state.view = 'buildings'; state.buildingId = null; state.floorId = null; state.areaId = null;
  } else if (type === 'floor') {
    const aids = db.areas.filter(a => a.floorId === id).map(a => a.id);
    const dids = db.devices.filter(d => aids.includes(d.areaId)).map(d => d.id);
    removeOpsForScopes(db, [{type:'floor',id}, ...aids.map(x=>({type:'area',id:x})), ...dids.map(x=>({type:'device',id:x}))]);
    db.devices = db.devices.filter(d => !aids.includes(d.areaId));
    db.areas = db.areas.filter(a => a.floorId !== id);
    db.floors = db.floors.filter(f => f.id !== id);
    state.view = 'floors'; state.floorId = null; state.areaId = null;
  } else if (type === 'area') {
    const dids = db.devices.filter(d => d.areaId === id).map(d => d.id);
    removeOpsForScopes(db, [{type:'area',id}, ...dids.map(x=>({type:'device',id:x}))]);
    db.devices = db.devices.filter(d => d.areaId !== id);
    db.areas = db.areas.filter(a => a.id !== id);
    state.view = 'areas'; state.areaId = null;
  } else if (type === 'device') {
    removeOpsForScopes(db, [{type:'device',id}]);
    db.devices = db.devices.filter(d => d.id !== id);
  }
  DB.set(db);
  render();
}

function downloadCSV(filename, rows) {
  const csv = rows.map(row => row.map(cell => {
    const value = String(cell ?? '');
    return '"' + value.replace(/"/g, '""') + '"';
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportOpsCSV(type) {
  const db = DB.get();
  const date = new Date().toISOString().split('T')[0];

  if (type === 'deficiencies') {
    const rows = [['Scope','Title','Priority','Status','Owner','Notes','Created']];
    (db.deficiencies || []).forEach(x => rows.push([scopeLabel(x.scopeType, x.scopeId), x.title, x.priority, x.status, x.owner, x.notes, new Date(x.createdAt || Date.now()).toLocaleString()]));
    downloadCSV(`d80-deficiencies-${date}.csv`, rows);
  } else if (type === 'materials') {
    const rows = [['Scope','Item','Qty Needed','Qty On Hand','Needed By','Status','Notes']];
    (db.materials || []).forEach(x => rows.push([scopeLabel(x.scopeType, x.scopeId), x.item, x.qtyNeeded, x.qtyOnHand, x.date, x.status, x.notes]));
    downloadCSV(`d80-materials-${date}.csv`, rows);
  } else if (type === 'crewLogs') {
    const rows = [['Scope','Date','Crew Count','Crew/Company','Notes']];
    (db.crewLogs || []).forEach(x => rows.push([scopeLabel(x.scopeType, x.scopeId), x.date, x.crewCount, x.owner, x.notes]));
    downloadCSV(`d80-crew-logs-${date}.csv`, rows);
  }
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      DB.set(data);
      render();
    } catch { alert('Invalid file.'); }
  };
  reader.readAsText(file);
}

function escStr(s) {
  return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function escapeHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function attachEvents() {
  document.onkeydown = (e) => {
    if (e.key === 'Escape') { state.modal = null; state.confirm = null; render(); }
    if (e.key === 'Enter' && state.modal) {
      const { type, parentId } = state.modal;
      saveModal(type, parentId || '');
    }
  };
}
